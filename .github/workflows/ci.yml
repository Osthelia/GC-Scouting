name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # cloudflare-env.d.ts is gitignored, the web typecheck needs it.
      - name: Generate Cloudflare types
        run: npm run cf-typegen --workspace=apps/web

      - run: npm run typecheck

      - name: Bot tests
        run: npm test --workspace=apps/bot

      - name: Check Drizzle migrations
        working-directory: packages/db
        run: npx drizzle-kit check

      - name: Build Worker bundle
        run: npm run cf-build --workspace=apps/web

      - name: Build bot Worker bundle
        working-directory: apps/bot
        run: npx wrangler deploy --dry-run --outdir dist
