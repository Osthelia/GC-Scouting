name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy scouting-bot and scouting-web
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Additive migrations first, the running Worker keeps working on the new schema.
      - name: Apply database migrations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

      # Worker secrets live on Cloudflare, a deploy keeps them.
      # The bot goes first: the site reaches it through a Service Binding.
      - name: Deploy scouting-bot
        run: npm run deploy --workspace=apps/bot

      - name: Build and deploy
        run: npm run deploy --workspace=apps/web
