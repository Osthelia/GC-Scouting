name: Images

# Three images: `gc-scouting-web`, `gc-scouting-web-migrate` (target `migrator`: drizzle-orm and pg only, the Job that applies the
# Drizzle migrations as an Argo CD PreSync hook) and `gc-scouting-bot`. Tag = commit SHA, the cluster picks the image from it.
#
# - push on main: CI, build, scan, push, then staging is bumped in the GitOps repository. Production is promoted by hand
#   (pull request on apps/production).
# - pull request carrying the `preview` label: build and push of the web and migrate images at the PR head SHA, which the
#   per-PR environment expects (ApplicationSet `preview`). The bot has no per-PR environment. Internal pull requests only:
#   a fork has no secret and no write access, and its code is never built here (the maintainer re-reads it and pushes it to
#   a branch of this repository, see the GitOps repository).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push ${{ matrix.image }}
    needs: ci
    # `ci` is skipped on a pull request (ci.yml already runs on its own `pull_request` trigger): run when it succeeded
    # or was skipped, never when it failed.
    if: >-
      !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (
        github.event_name != 'pull_request' || (
          contains(github.event.pull_request.labels.*.name, 'preview') &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # `matrix` is not available in a job-level `if`: the bot (no per-PR environment) is left out of the matrix instead.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"image":"gc-scouting-web","file":"apps/web/Dockerfile","target":"runner"},{"image":"gc-scouting-web-migrate","file":"apps/web/Dockerfile","target":"migrator"}]' || '[{"image":"gc-scouting-web","file":"apps/web/Dockerfile","target":"runner"},{"image":"gc-scouting-web-migrate","file":"apps/web/Dockerfile","target":"migrator"},{"image":"gc-scouting-bot","file":"apps/bot/Dockerfile","target":""},{"image":"gc-scouting-web-cdn","file":"apps/web/Dockerfile","target":"runner","assetPrefix":"https://cdn.scouting.gc-stats.app"}]') }}
    env:
      IMAGE: ghcr.io/osthelia/${{ matrix.image }}
      TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded first, scanned, only then pushed: a vulnerable image never reaches the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            ASSET_PREFIX=${{ matrix.assetPrefix }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push "${IMAGE}:${TAG}"

  # Inline steps instead of the reusable workflow: this repository is public and cannot call a workflow
  # from the private Osthelia/GitOps repository.
  gitops:
    name: Bump staging
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: Osthelia/GitOps
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      # All tags in one commit: the web, migrate and bot images must move together.
      - name: Set tags
        env:
          TAG: ${{ github.sha }}
          FILE: apps/staging/kustomization.yaml
        run: |
          set -euo pipefail
          for IMAGE in gc-scouting-web gc-scouting-web-migrate gc-scouting-bot; do
            grep -qE "name: ghcr\.io/osthelia/${IMAGE}," "$FILE" \
              || { echo "::error::${IMAGE} not found in ${FILE}"; exit 1; }
            sed -i -E "s#(name: ghcr\.io/osthelia/${IMAGE},[[:space:]]*newTag:)[^}]*#\1 \"${TAG}\" #" "$FILE"
            grep -E "name: ghcr\.io/osthelia/${IMAGE}," "$FILE"
          done

      - name: Commit and push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(staging): gc-scouting -> ${TAG:0:7}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::push failed after 3 attempts"
          exit 1
